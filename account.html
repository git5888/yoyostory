<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的故事星球</title><link rel="stylesheet" href="account.css"></head><body><main><header><a href="/">✦ 故事星球</a><div><span id="who">加载账户中…</span><button id="logout">退出登录</button></div></header><section class="hero"><p>MY STORY PLANET</p><h1 id="hello">我的亲子故事空间</h1><div class="metrics"><b><i id="points">—</i> 星光积分</b><button id="checkin">每日签到</button><button id="recharge">充值积分</button></div></section><nav><button data-tab="voices" class="active">我的声音</button><button data-tab="create">创作作品</button><button data-tab="library">我的作品</button><button data-tab="billing">积分账单</button></nav><section id="voices" class="panel"><h2>声音样本库 <small>最多保存 5 组</small></h2><form id="upload" class="upload"><input id="voiceName" placeholder="样本名称，例如：妈妈的晚安声" required><input id="voiceFile" type="file" accept="audio/*" required><button>上传声音样本</button></form><div id="voiceList" class="list"></div><h2>平台免费音色</h2><div id="systemVoices" class="list"></div></section><section id="create" class="panel" hidden><h2>创作新故事</h2><textarea id="manualContent" placeholder="粘贴或手动输入故事正文。也可在首页使用 AI 魔法创作。"></textarea><div class="actions"><input id="storyTitle" placeholder="故事标题"><button id="saveDraft">保存草稿</button><a href="/">使用 AI 创作 →</a></div><p class="hint">TXT/Word 导入、AI 文案与封面/音频生成会在作品编辑器中继续完善。</p></section><section id="library" class="panel" hidden><h2>我的作品</h2><div id="storyList" class="list"></div></section><section id="billing" class="panel" hidden><h2>积分账单</h2><div id="billList" class="list"></div></section><p id="toast" role="status"></p></main><script src="account.js"></script></body></html>
