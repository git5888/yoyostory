<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的故事星球</title><link rel="stylesheet" href="account.css"></head><body><main><header><a href="/">✦ 故事星球</a><div><span id="who">加载账户中…</span><button id="logout">退出登录</button></div></header><section class="hero"><p>MY STORY PLANET</p><h1 id="hello">我的亲子故事空间</h1><div class="metrics"><b><i id="points">—</i> 星光积分</b><button id="checkin">每日签到</button><button id="recharge">充值积分</button></div></section><nav><button data-tab="voices" class="active">我的声音</button><button data-tab="create">创作作品</button><button data-tab="library">我的作品</button><button data-tab="billing">积分账单</button></nav><section id="voices" class="panel"><h2>声音样本库 <small>最多保存 5 组</small></h2><section class="recorder"><p>朗读下面约 100 字文案，录入更自然的亲子陪伴声音。</p><blockquote>晚上好，我是故事星球的声音伙伴。月亮轻轻照着窗台，小熊抱着星星枕头，听见树叶在风里唱歌。每一个温柔的字，都会变成陪伴孩子入睡的小小魔法。现在，请带着自然、清晰和放松的声音，把这段话读给孩子听。</blockquote><input id="recordName" placeholder="录音样本名称，例如：妈妈的晚安声"><div class="actions"><button id="recordStart">开始录音</button><button id="recordPause" class="soft" disabled>暂停录音</button><button id="recordRetry" class="soft" disabled>重录</button><button id="recordUpload" disabled>上传到声音样本库</button></div><audio id="recordPreview" controls hidden></audio><small id="recordStatus">请准备开始录音</small></section><form id="upload" class="upload"><input id="voiceName" placeholder="样本名称，例如：妈妈的晚安声" required><input id="voiceFile" type="file" accept="audio/*" required><button>上传本地音频</button></form><div id="voiceList" class="list"></div><h2>平台免费音色 <small>点击“试听”播放示例</small></h2><div id="systemVoices" class="list"></div></section><section id="create" class="panel" hidden><h2>创作新故事</h2><textarea id="manualContent" placeholder="粘贴或手动输入故事正文。也可在首页使用 AI 魔法创作。"></textarea><div class="actions"><input id="storyTitle" placeholder="故事标题"><button id="saveDraft">保存草稿</button><a href="/">使用 AI 创作 →</a></div></section><section id="library" class="panel" hidden><h2>我的作品</h2><div id="storyList" class="list"></div></section><section id="billing" class="panel" hidden><h2>积分账单</h2><div id="billList" class="list"></div></section><p id="toast" role="status"></p></main><script src="account.js"></script><script src="voice-preview.js"></script><script src="voice-recorder.js"></script></body></html>
