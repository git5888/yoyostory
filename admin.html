<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>故事星球 · 超级管理后台</title><link rel="stylesheet" href="admin.css?v=20260816b"></head>
<body><main>
  <section id="login" class="panel login-panel"><p>STORY PLANET · ADMIN</p><h1>超级管理后台</h1><input id="phone" placeholder="管理员手机号" inputmode="numeric" autocomplete="username"><input id="password" type="password" placeholder="管理员密码" autocomplete="current-password"><button id="loginBtn">安全登录 →</button><small id="error" role="alert"></small></section>
  <section id="dashboard" hidden>
    <header><div><p>STORY PLANET · CONTROL ROOM</p><h1>运营总览</h1></div><div class="header-actions"><span id="operator"></span><button class="subtle" id="refresh">刷新数据</button><button id="logout">退出登录</button></div></header>
    <div class="stats"><article><span>注册用户</span><b id="users">—</b></article><article><span>故事作品</span><b id="stories">—</b></article><article><span>今日任务</span><b id="tasks">—</b></article><article><span>累计积分消耗</span><b id="points">—</b></article></div>
    <nav class="tabs" aria-label="后台模块"><button class="tab active" data-tab="models">模型与计费</button><button class="tab" data-tab="members">用户与积分</button><button class="tab" data-tab="rules">运营规则</button><button class="tab" data-tab="ledger">积分流水</button></nav>
    <section id="modelsTab" class="panel tab-panel"><div class="bar"><div><p>MODEL CONNECTION</p><h2>模型配置</h2></div></div><form id="modelForm" class="form-grid"><input id="modelName" required placeholder="显示名称，例如：DeepSeek V3"><select id="modelCategory"><option value="text">文本模型</option><option value="tts">语音模型</option><option value="image">图片模型</option></select><input id="modelProvider" required placeholder="供应商，例如：OpenAI / 阿里云"><input id="modelIdentifier" required placeholder="模型 ID，例如：gpt-4o-mini"><select id="modelProtocol"><option value="openai-compatible">OpenAI Compatible</option><option value="custom">Custom HTTP API</option></select><input id="modelUrl" required type="url" placeholder="Base URL / 推理接口 URL"><input id="apiKeyRef" placeholder="服务器密钥变量，例如：TEXT_API_KEY"><input id="timeoutMs" type="number" value="30000" min="1000" placeholder="超时（毫秒）"><input id="maxRetries" type="number" value="2" min="0" placeholder="重试次数"><textarea id="requestConfig" placeholder='高级参数 JSON，例如：{"temperature":0.7}'></textarea><button type="submit">保存模型配置</button></form><h3>计费策略（与模型连接配置分开）</h3><div id="pricingHint">文本：输入/输出 Token 按百万计费；语音：按分钟计费；图片：按分辨率与张数计费。</div><form id="pricingForm" class="form-grid"><select id="pricingModel"></select><input id="priceInput" type="number" min="0" step="0.01" placeholder="文本输入：积分/百万 Token"><input id="priceOutput" type="number" min="0" step="0.01" placeholder="文本输出：积分/百万 Token"><input id="priceMinute" type="number" min="0" step="0.01" placeholder="语音：积分/分钟"><input id="price512" type="number" min="0" step="0.01" placeholder="图片 512：积分/张"><input id="price1024" type="number" min="0" step="0.01" placeholder="图片 1024：积分/张"><button>保存计费策略</button></form><div id="models" class="models"></div></section>
    <section id="membersTab" class="panel tab-panel" hidden><div class="bar"><div><p>MEMBER CONTROL</p><h2>用户与积分</h2></div><input id="userSearch" class="search" placeholder="手机号或昵称搜索"></div><div id="members" class="members"></div></section>
    <section id="rulesTab" class="panel tab-panel" hidden><div class="bar"><div><p>OPERATIONS</p><h2>运营积分规则</h2></div><form id="rulesForm" class="form-grid rules"><label>新用户注册赠送<input id="registerBonus" type="number" min="0" step="1"></label><label>每日签到赠送<input id="dailyCheckin" type="number" min="0" step="1"></label><label>连续 7 天签到奖励<input id="seventhDayBonus" type="number" min="0" step="1"></label><button type="submit">保存运营规则</button></form><p class="hint">变更会立即用于后续注册和签到，不影响已有积分。</p></section><section id="ledgerTab" class="panel tab-panel" hidden><div class="bar"><div><p>BILLING AUDIT</p><h2>积分流水与审计</h2></div><div id="ledger" class="members"></div></section>
  </section>
  <div id="toast" role="status" aria-live="polite"></div>
</main><script src="admin.js?v=20260816b"></script></body></html>
