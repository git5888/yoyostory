name: Deploy yoyostory

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: yoyostory-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check backend/src/server.js
          node --check yoyo/player.js

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/yoyostory_deploy
          chmod 600 ~/.ssh/yoyostory_deploy
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT || 22 }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload release
        env:
          RELEASE_BASE_SHA: ${{ github.event.before }}
        run: |
          git ls-files -z -- yoyo ':!yoyo/audio/*' > /tmp/yoyo-release-files
          if [ -n "$RELEASE_BASE_SHA" ] && git cat-file -e "$RELEASE_BASE_SHA^{commit}" 2>/dev/null; then
            git diff --name-only --diff-filter=ACMR -z "$RELEASE_BASE_SHA" "$GITHUB_SHA" -- yoyo/audio/ >> /tmp/yoyo-release-files
          else
            git ls-files -z -- yoyo/audio/ >> /tmp/yoyo-release-files
          fi
          tar --null -T /tmp/yoyo-release-files -czf /tmp/yoyostory-release.tgz index.html styles.css app.js auth.css admin.html admin.css admin.js account.html account.css account.js voice-preview.js voice-recorder.js backend
          scp -P "${{ secrets.DEPLOY_PORT || 22 }}" -i ~/.ssh/yoyostory_deploy /tmp/yoyostory-release.tgz \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/yoyostory-release.tgz"

      - name: Install and restart production
        env:
          RELEASE_SHA: ${{ github.sha }}
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ALIYUN_SMS_SIGN_NAME: ${{ secrets.ALIYUN_SMS_SIGN_NAME }}
          ALIYUN_SMS_TEMPLATE_CODE: ${{ secrets.ALIYUN_SMS_TEMPLATE_CODE }}
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT || 22 }}" -i ~/.ssh/yoyostory_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "RELEASE_SHA=$RELEASE_SHA DEPLOY_PATH='${{ secrets.DEPLOY_PATH || '/var/www/yoyostory' }}' ALIYUN_ACCESS_KEY_ID='$ALIYUN_ACCESS_KEY_ID' ALIYUN_ACCESS_KEY_SECRET='$ALIYUN_ACCESS_KEY_SECRET' ALIYUN_SMS_SIGN_NAME='$ALIYUN_SMS_SIGN_NAME' ALIYUN_SMS_TEMPLATE_CODE='$ALIYUN_SMS_TEMPLATE_CODE' bash -s" <<'REMOTE'
          set -euo pipefail
          release_dir=/tmp/yoyostory-release-${RELEASE_SHA}
          rm -rf "$release_dir"
          mkdir -p "$release_dir" "$DEPLOY_PATH/backend"
          tar xzf /tmp/yoyostory-release.tgz -C "$release_dir"
          cp "$release_dir/index.html" "$release_dir/styles.css" "$release_dir/app.js" "$release_dir/auth.css" "$release_dir/admin.html" "$release_dir/admin.css" "$release_dir/admin.js" "$release_dir/account.html" "$release_dir/account.css" "$release_dir/account.js" "$release_dir/voice-preview.js" "$release_dir/voice-recorder.js" "$DEPLOY_PATH/"
          cp -R "$release_dir/yoyo" "$DEPLOY_PATH/"
          rm -rf "$DEPLOY_PATH/backend/src"
          cp -R "$release_dir/backend/src" "$DEPLOY_PATH/backend/src"
          cp "$release_dir/backend/package.json" "$DEPLOY_PATH/backend/package.json"
          cp "$release_dir/backend/schema.sql" "$DEPLOY_PATH/backend/schema.sql"
          cd "$DEPLOY_PATH/backend"
          release_sha="$RELEASE_SHA"
          set -a
          . ./.env
          set +a
          sed -i '/^ALIYUN_ACCESS_KEY_ID=/d;/^ALIYUN_ACCESS_KEY_SECRET=/d;/^ALIYUN_SMS_SIGN_NAME=/d;/^ALIYUN_SMS_TEMPLATE_CODE=/d' .env
          printf 'ALIYUN_ACCESS_KEY_ID=%s\nALIYUN_ACCESS_KEY_SECRET=%s\nALIYUN_SMS_SIGN_NAME=%s\nALIYUN_SMS_TEMPLATE_CODE=%s\n' "$ALIYUN_ACCESS_KEY_ID" "$ALIYUN_ACCESS_KEY_SECRET" "$ALIYUN_SMS_SIGN_NAME" "$ALIYUN_SMS_TEMPLATE_CODE" >> .env
          set -a
          . ./.env
          set +a
          export RELEASE_SHA="$release_sha"
          sudo -u postgres psql -d yoyostory -v ON_ERROR_STOP=1 -f schema.sql
          npm install --omit=dev --no-audit --no-fund
          printf '\nRELEASE_SHA=%s\n' "$RELEASE_SHA" >> .env
          pm2 restart yoyostory-api --update-env
          pm2 save
          nginx -t
          systemctl reload nginx
          rm -rf "$release_dir" /tmp/yoyostory-release.tgz
          REMOTE

      - name: Verify deployed site
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          test "$(curl -fsS https://ting.ywjs.com/api/health | grep -o '"release":"[^"]*"' | cut -d'"' -f4)" = "$RELEASE_SHA"
          curl -fsS https://ting.ywjs.com/ | grep -q '故事星球'
          curl -fsS https://ting.ywjs.com/app.js | grep -q 'openAuth'
          curl -fsS https://ting.ywjs.com/yoyo/ | grep -q '宝宝的晚安故事'
          curl -fsS https://ting.ywjs.com/yoyo/ | grep -q '爸爸陪我学英语'
          for story in $(seq -w 1 10); do
            curl -fsSI "https://ting.ywjs.com/yoyo/audio/story-$story.mp3" | grep -qi 'content-type: audio/mpeg'
            curl -fsSI "https://ting.ywjs.com/yoyo/audio/english-$story.mp3" | grep -qi 'content-type: audio/mpeg'
          done
          curl -fsS https://ting.ywjs.com/yoyo/ | grep -q '学英语第二辑'
          for story in $(seq 11 20); do
            curl -fsSI "https://ting.ywjs.com/yoyo/audio/english-$story.mp3" | grep -qi 'content-type: audio/mpeg'
          done
          curl -fsS https://ting.ywjs.com/yoyo/ | grep -q '学英语第三辑'
          for story in $(seq 21 40); do
            curl -fsSI "https://ting.ywjs.com/yoyo/audio/english-$story.mp3" | grep -qi 'content-type: audio/mpeg'
          done
          curl -fsS https://ting.ywjs.com/yoyo/ | grep -q '学英语第四辑'
          for story in $(seq 41 70); do
            curl -fsSI "https://ting.ywjs.com/yoyo/audio/english-$story.mp3" | grep -qi 'content-type: audio/mpeg'
          done
          curl -fsS https://ting.ywjs.com/yoyo/ | grep -q '悠悠的五个小发现'
          for story in $(seq -w 1 5); do
            curl -fsSI "https://ting.ywjs.com/yoyo/audio/logic-0$story.mp3" | grep -qi 'content-type: audio/mpeg'
          done
